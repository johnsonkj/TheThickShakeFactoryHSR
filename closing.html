<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Closing Checklist — The Shake Factory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-indigo-50 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-8">
    <a href="index.html" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 mb-4">← Back to Home</a>

    <header class="bg-white rounded-2xl p-6 shadow-md mb-6 border-l-4 border-blue-400">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div>
          <h1 class="text-2xl font-bold text-gray-800">🌙 Closing Checklist</h1>
          <p class="text-sm text-gray-500" id="dateDisplay"></p>
          <p class="text-xs text-amber-700 mt-1">Logged in as <span class="font-bold" id="workerLabel">…</span></p>
        </div>
        <div class="text-right">
          <div class="text-xs text-gray-500">Progress</div>
          <div class="text-2xl font-bold text-blue-600" id="progressText">0 / 7</div>
        </div>
      </div>
      <div class="mt-3 w-full bg-gray-200 rounded-full h-2">
        <div id="progressBar" class="bg-blue-400 h-2 rounded-full transition-all" style="width: 0%"></div>
      </div>
    </header>

    <div class="bg-white rounded-2xl p-6 shadow-md mb-6">
      <ul id="checklistItems" class="space-y-3"></ul>
    </div>

    <!-- Bonus sales section (shown only if admin has configured sections) -->
    <div id="bonusSection" class="bg-white rounded-2xl p-6 shadow-md mb-6 border-l-4 border-yellow-400 hidden">
      <h2 class="text-lg font-bold text-gray-800 mb-1">💰 Today's Sales (Bonus)</h2>
      <p class="text-xs text-gray-500 mb-4">Enter today's quantity sold and total amount for each section.</p>
      <div id="bonusList"></div>

      <div class="mt-4 pt-4 border-t border-gray-100 grid grid-cols-2 gap-3">
        <div class="bg-yellow-50 rounded-lg p-3 text-center">
          <div class="text-xs text-gray-500">Today's bonus sales</div>
          <div class="font-bold text-yellow-700" id="todayBonusTotal">₹ 0</div>
        </div>
        <div class="bg-green-50 rounded-lg p-3 text-center">
          <div class="text-xs text-gray-500">Today's incentive</div>
          <div class="font-bold text-green-700"><span id="todayIncentivePerWorker">₹ 0</span> each</div>
        </div>
      </div>
    </div>

    <button id="submitBtn" class="w-full bg-blue-500 hover:bg-blue-600 disabled:bg-gray-300 text-white font-bold py-4 rounded-2xl shadow-md transition-all">
      Save Closing Checklist
    </button>

    <div id="message" class="mt-4 text-center"></div>
  </div>

  <script type="module">
    import { saveChecklist, getTodayChecklist, getBonusConfig } from './app.js';

    // ===== Auth gate =====
    const _auth = JSON.parse(sessionStorage.getItem('tsf_auth') || '{}');
    const AUTH_TTL_MS = 60 * 60 * 1000;
    if (_auth.target !== 'closing' || !_auth.worker || !_auth.at || Date.now() - _auth.at > AUTH_TTL_MS) {
      alert('Please open this page from the home portal (authentication required).');
      location.href = 'index.html';
      throw new Error('not authenticated');
    }
    const worker = _auth.worker;
    document.getElementById('workerLabel').textContent = worker.charAt(0).toUpperCase() + worker.slice(1);

    const tasks = [
      "Switch OFF the computer and weighing machine",
      "Switch OFF the lights",
      "Sweep and mop the entire area",
      "Clean the glass door",
      "Clean all tables (inside and outside)",
      "Clean blender, waffle machine, cone machine, measuring spoons, scoopers, and mixing spoons",
      "Clean display freezer glass, side walls, and sink"
    ];

    const today = new Date();
    document.getElementById('dateDisplay').textContent = today.toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    const list = document.getElementById('checklistItems');
    tasks.forEach((task, i) => {
      const li = document.createElement('li');
      li.className = "flex items-start gap-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer";
      li.innerHTML = `
        <input type="checkbox" id="task-${i}" class="mt-1 w-5 h-5 accent-blue-500 cursor-pointer" />
        <label for="task-${i}" class="flex-1 cursor-pointer">
          <span class="text-xs text-gray-400 mr-2">${i + 1}.</span>
          <span class="text-gray-700">${task}</span>
        </label>
      `;
      list.appendChild(li);
    });

    function updateProgress() {
      const checked = document.querySelectorAll('#checklistItems input:checked').length;
      const total = tasks.length;
      document.getElementById('progressText').textContent = `${checked} / ${total}`;
      document.getElementById('progressBar').style.width = `${(checked / total) * 100}%`;
    }

    document.querySelectorAll('#checklistItems input').forEach(cb => {
      cb.addEventListener('change', updateProgress);
    });

    // ===== Bonus sales section =====
    let loadedBonusConfig = null;          // last-known config from Firestore
    const bonusFormState = {};             // { [sectionName]: { qty, amount } }

    function renderBonusSection() {
      const sec = loadedBonusConfig;
      const container = document.getElementById('bonusSection');
      const list = document.getElementById('bonusList');

      if (!sec || !sec.sections || sec.sections.length === 0) {
        container.classList.add('hidden');
        list.innerHTML = '';
        updateLiveIncentive();
        return;
      }
      container.classList.remove('hidden');

      // Drop entries for sections that no longer exist
      Object.keys(bonusFormState).forEach(k => {
        if (!sec.sections.includes(k)) delete bonusFormState[k];
      });

      list.innerHTML = sec.sections.map(name => {
        const cur = bonusFormState[name] || { qty: '', amount: '' };
        return `
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-3 items-center mb-3">
            <label class="text-sm font-semibold text-gray-700">${name}</label>
            <input type="number" min="0" step="1" placeholder="Qty"
                   data-bonus-qty="${name}" value="${cur.qty}"
                   class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-yellow-400 focus:outline-none" />
            <input type="number" min="0" step="1" placeholder="Amount ₹"
                   data-bonus-amt="${name}" value="${cur.amount}"
                   class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-yellow-400 focus:outline-none" />
          </div>
        `;
      }).join('');

      list.querySelectorAll('input[data-bonus-qty]').forEach(inp => {
        inp.addEventListener('input', () => {
          const name = inp.dataset.bonusQty;
          if (!bonusFormState[name]) bonusFormState[name] = { qty: '', amount: '' };
          bonusFormState[name].qty = inp.value;
          updateLiveIncentive();
        });
      });
      list.querySelectorAll('input[data-bonus-amt]').forEach(inp => {
        inp.addEventListener('input', () => {
          const name = inp.dataset.bonusAmt;
          if (!bonusFormState[name]) bonusFormState[name] = { qty: '', amount: '' };
          bonusFormState[name].amount = inp.value;
          updateLiveIncentive();
        });
      });

      updateLiveIncentive();
    }

    function updateLiveIncentive() {
      const sec = loadedBonusConfig || { percent: 0 };
      let total = 0;
      Object.values(bonusFormState).forEach(v => { total += Number(v.amount) || 0; });
      const incentive = (total * (Number(sec.percent) || 0)) / 100;
      const totEl = document.getElementById('todayBonusTotal');
      const incEl = document.getElementById('todayIncentivePerWorker');
      if (totEl) totEl.textContent = '₹ ' + total.toLocaleString('en-IN');
      if (incEl) incEl.textContent = '₹ ' + (incentive / 2).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }

    async function loadBonusConfig() {
      try {
        loadedBonusConfig = await getBonusConfig();
      } catch (e) {
        console.error('Bonus config load failed:', e);
        loadedBonusConfig = { sections: [], percent: 0 };
      }
      renderBonusSection();
    }
    loadBonusConfig();

    // ===== Pre-fill checklist + bonus values for today =====
    getTodayChecklist('closing').then(data => {
      if (data && data.tasks) {
        data.tasks.forEach((checked, i) => {
          const cb = document.getElementById(`task-${i}`);
          if (cb) cb.checked = checked;
        });
        updateProgress();
        if (data.completed) {
          document.getElementById('message').innerHTML = '<p class="text-sm text-blue-600">✓ Already saved today. You can update and save again.</p>';
        }
      }
      if (data && data.bonusSales && typeof data.bonusSales === 'object') {
        Object.entries(data.bonusSales).forEach(([name, val]) => {
          bonusFormState[name] = {
            qty: val.qty != null ? String(val.qty) : '',
            amount: val.amount != null ? String(val.amount) : '',
          };
        });
        // Re-render once config is also loaded
        if (loadedBonusConfig) renderBonusSection();
      }
    }).catch(err => console.error(err));

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      // ===== Freshness check on bonus config =====
      // If admin changed sections since the page loaded, re-render and abort save.
      try {
        const fresh = await getBonusConfig();
        const oldList = JSON.stringify((loadedBonusConfig?.sections || []).slice().sort());
        const newList = JSON.stringify((fresh?.sections || []).slice().sort());
        if (oldList !== newList) {
          loadedBonusConfig = fresh;
          renderBonusSection();
          alert('Bonus sections were updated by the admin. Please review the highlighted section and save again.');
          btn.textContent = 'Save Closing Checklist';
          btn.disabled = false;
          return;
        }
        // Always pick up latest percent (snapshot at save-time)
        loadedBonusConfig = fresh;
      } catch (e) {
        console.error('Bonus config refresh failed; proceeding with last-known config.', e);
      }

      const checked = Array.from(document.querySelectorAll('#checklistItems input')).map(cb => cb.checked);
      const allDone = checked.every(c => c);

      // Build bonusSales (only for currently-active sections)
      const bonusSales = {};
      const sections = (loadedBonusConfig?.sections) || [];
      sections.forEach(name => {
        const v = bonusFormState[name] || {};
        bonusSales[name] = {
          qty: Number.isFinite(Number(v.qty)) ? Number(v.qty) : 0,
          amount: Number.isFinite(Number(v.amount)) ? Number(v.amount) : 0,
        };
      });
      const bonusPercent = Number(loadedBonusConfig?.percent) || 0;

      try {
        await saveChecklist('closing', {
          tasks: checked,
          completed: allDone,
          worker: worker,
          timestamp: new Date().toISOString(),
          bonusSales,
          bonusPercent,
        });

        // Live recompute the just-saved incentive (so the message reflects what's stored)
        const totalAmt = Object.values(bonusSales).reduce((s, x) => s + (x.amount || 0), 0);
        const dayInc = (totalAmt * bonusPercent) / 100;
        const eachShare = dayInc / 2;

        let msg = `<p class="text-blue-600 font-semibold">✓ Saved successfully!</p>`;
        if (sections.length > 0 && totalAmt > 0) {
          msg += `<p class="text-sm text-green-700 mt-1">Today's incentive: <span class="font-bold">₹ ${eachShare.toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span> each.</p>`;
        }
        document.getElementById('message').innerHTML = msg;

        // Bust home-page incentive cache so the banner refreshes on next visit
        sessionStorage.removeItem('tsf_incentive_cache');

        btn.textContent = 'Saved ✓';
        setTimeout(() => { btn.textContent = 'Save Closing Checklist'; btn.disabled = false; }, 2000);
      } catch (err) {
        document.getElementById('message').innerHTML = `<p class="text-red-600">✗ Error: ${err.message}</p>`;
        btn.textContent = 'Save Closing Checklist';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
