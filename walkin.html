<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walk-in Sales — The Shake Factory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gradient-to-br from-emerald-50 via-white to-teal-50 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <a href="index.html" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 mb-4">← Back to Home</a>

    <header class="bg-white rounded-2xl p-6 shadow-md mb-6 border-l-4 border-emerald-400">
      <h1 class="text-2xl font-bold text-gray-800">💵 Walk-in Sales</h1>
      <p class="text-sm text-gray-500" id="dateDisplay"></p>
      <p class="text-xs text-amber-700 mt-1">Logged in as <span class="font-bold" id="workerLabel">…</span></p>
      <p class="text-xs text-gray-400 mt-2">Add each customer's bill. Use the dropdown if a different worker is recording the entry.</p>
    </header>

    <!-- Add entry form -->
    <div class="bg-white rounded-2xl p-6 shadow-md mb-6">
      <h2 class="text-lg font-bold text-gray-800 mb-4">Add Entry</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Bill No.</label>
          <input id="billInput" type="text" placeholder="e.g. HSR3241" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-emerald-400 focus:outline-none uppercase" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Amount (₹)</label>
          <input id="amountInput" type="number" min="1" step="1" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-emerald-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Payment</label>
          <div class="flex gap-2">
            <button type="button" data-method="upi" class="method-btn flex-1 px-3 py-2 border border-gray-300 rounded-lg font-semibold text-sm hover:bg-emerald-50">UPI</button>
            <button type="button" data-method="cash" class="method-btn flex-1 px-3 py-2 border border-gray-300 rounded-lg font-semibold text-sm hover:bg-emerald-50">Cash</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Recorded by</label>
          <select id="workerSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-emerald-400 focus:outline-none">
            <option value="surya">Surya</option>
            <option value="sushanth">Sushanth</option>
          </select>
        </div>
      </div>

      <button id="addBtn" class="mt-4 w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-gray-300 text-white font-bold py-3 rounded-xl shadow-md transition-all">
        + Add Entry
      </button>
      <p id="formMsg" class="text-sm mt-3 hidden"></p>
    </div>

    <!-- Today's entries -->
    <div class="bg-white rounded-2xl p-6 shadow-md mb-6">
      <h2 class="text-lg font-bold text-gray-800 mb-2">Today's Entries</h2>
      <div id="entriesList" class="overflow-x-auto">Loading…</div>

      <div class="grid grid-cols-3 gap-3 mt-4 pt-4 border-t border-gray-100" id="totalsRow">
        <div class="bg-emerald-50 rounded-lg p-3 text-center">
          <div class="text-xs text-gray-500">UPI</div>
          <div class="font-bold text-emerald-700" id="upiTotal">₹ 0</div>
        </div>
        <div class="bg-amber-50 rounded-lg p-3 text-center">
          <div class="text-xs text-gray-500">Cash</div>
          <div class="font-bold text-amber-700" id="cashTotal">₹ 0</div>
        </div>
        <div class="bg-gray-100 rounded-lg p-3 text-center">
          <div class="text-xs text-gray-500">Total (<span id="entryCount">0</span> bills)</div>
          <div class="font-bold text-gray-800" id="grandTotal">₹ 0</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { addWalkinSale, getWalkinSalesByDate, deleteWalkinSale } from './app.js';

    // ===== Auth gate =====
    const _auth = JSON.parse(sessionStorage.getItem('tsf_auth') || '{}');
    const AUTH_TTL_MS = 60 * 60 * 1000;
    if (_auth.target !== 'walkin' || !_auth.worker || !_auth.at || Date.now() - _auth.at > AUTH_TTL_MS) {
      alert('Please open this page from the home portal (authentication required).');
      location.href = 'index.html';
      throw new Error('not authenticated');
    }
    const authedWorker = _auth.worker;
    document.getElementById('workerLabel').textContent = authedWorker.charAt(0).toUpperCase() + authedWorker.slice(1);
    document.getElementById('workerSelect').value = authedWorker;

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    const today = new Date();
    document.getElementById('dateDisplay').textContent = today.toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    // ===== Payment method buttons (acts like radio) =====
    let selectedMethod = null;
    document.querySelectorAll('.method-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedMethod = btn.dataset.method;
        document.querySelectorAll('.method-btn').forEach(b => {
          if (b.dataset.method === selectedMethod) {
            b.className = 'method-btn flex-1 px-3 py-2 border-2 border-emerald-500 bg-emerald-50 text-emerald-700 rounded-lg font-semibold text-sm';
          } else {
            b.className = 'method-btn flex-1 px-3 py-2 border border-gray-300 rounded-lg font-semibold text-sm hover:bg-emerald-50';
          }
        });
      });
    });

    function showMsg(text, ok = true) {
      const el = document.getElementById('formMsg');
      el.textContent = text;
      el.className = `text-sm mt-3 ${ok ? 'text-emerald-600' : 'text-red-600'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function fmt(n) { return '₹ ' + n.toLocaleString('en-IN'); }

    function timeOf(ts) {
      return new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    }

    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

    async function loadEntries() {
      const listEl = document.getElementById('entriesList');
      try {
        const entries = await getWalkinSalesByDate(todayStr());
        if (entries.length === 0) {
          listEl.innerHTML = '<p class="text-gray-400 italic text-sm">No entries yet today.</p>';
        } else {
          let html = `<table class="w-full text-sm">
            <thead>
              <tr class="text-left text-gray-500 border-b">
                <th class="py-2">Time</th>
                <th class="py-2">Bill No.</th>
                <th class="py-2 text-right">Amount</th>
                <th class="py-2">Method</th>
                <th class="py-2">Recorded by</th>
                <th class="py-2"></th>
              </tr>
            </thead>
            <tbody>`;
          entries.forEach(e => {
            const methodBadge = e.method === 'upi'
              ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-semibold">UPI</span>'
              : '<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-xs font-semibold">Cash</span>';
            html += `<tr class="border-b border-gray-50 hover:bg-gray-50">
              <td class="py-2 text-gray-500">${timeOf(e.ts)}</td>
              <td class="py-2 font-semibold">${e.billNo}</td>
              <td class="py-2 text-right font-semibold">${fmt(e.amount)}</td>
              <td class="py-2">${methodBadge}</td>
              <td class="py-2 text-gray-600">${cap(e.worker)}</td>
              <td class="py-2 text-right">
                <button class="del-btn text-red-500 hover:text-red-700 text-xs" data-bill="${e.billNo}">🗑 Delete</button>
              </td>
            </tr>`;
          });
          html += '</tbody></table>';
          listEl.innerHTML = html;

          listEl.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', () => onDelete(btn.dataset.bill));
          });
        }

        // Totals
        const upi = entries.filter(e => e.method === 'upi').reduce((s, e) => s + e.amount, 0);
        const cash = entries.filter(e => e.method === 'cash').reduce((s, e) => s + e.amount, 0);
        document.getElementById('upiTotal').textContent = fmt(upi);
        document.getElementById('cashTotal').textContent = fmt(cash);
        document.getElementById('grandTotal').textContent = fmt(upi + cash);
        document.getElementById('entryCount').textContent = entries.length;
      } catch (e) {
        listEl.innerHTML = `<p class="text-red-500 text-sm">Error: ${e.message}</p>`;
      }
    }

    async function onDelete(billNo) {
      if (!confirm(`Delete bill ${billNo}? This can't be undone.`)) return;
      try {
        await deleteWalkinSale(billNo);
        showMsg(`Bill ${billNo} deleted.`);
        loadEntries();
      } catch (e) {
        showMsg(`✗ ${e.message}`, false);
      }
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const billNo = document.getElementById('billInput').value.trim().toUpperCase();
      const amountStr = document.getElementById('amountInput').value.trim();
      const amount = parseInt(amountStr, 10);
      const worker = document.getElementById('workerSelect').value;

      if (!billNo) return showMsg('Enter a bill number', false);
      if (!Number.isFinite(amount) || amount <= 0) return showMsg('Enter an amount greater than 0', false);
      if (!selectedMethod) return showMsg('Select UPI or Cash', false);

      const btn = document.getElementById('addBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await addWalkinSale({
          billNo,
          amount,
          method: selectedMethod,
          worker,
          date: todayStr(),
          ts: new Date().toISOString(),
        });
        showMsg(`✓ Bill ${billNo} added.`);
        // reset form (but keep selected method + worker for fast repeat entry)
        document.getElementById('billInput').value = '';
        document.getElementById('amountInput').value = '';
        document.getElementById('billInput').focus();
        loadEntries();
      } catch (e) {
        showMsg(`✗ ${e.message}`, false);
      } finally {
        btn.disabled = false;
        btn.textContent = '+ Add Entry';
      }
    });

    // Auto-uppercase bill number as user types
    document.getElementById('billInput').addEventListener('input', e => {
      e.target.value = e.target.value.toUpperCase();
    });

    // Enter key submits
    ['billInput', 'amountInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', e => {
        if (e.key === 'Enter') document.getElementById('addBtn').click();
      });
    });

    loadEntries();
  </script>
</body>
</html>
