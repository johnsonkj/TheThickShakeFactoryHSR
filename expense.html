<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense — The Shake Factory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gradient-to-br from-purple-50 via-white to-fuchsia-50 min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <a href="index.html" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 mb-4">← Back to Home</a>

    <header class="bg-white rounded-2xl p-6 shadow-md mb-6 border-l-4 border-purple-400">
      <h1 class="text-2xl font-bold text-gray-800">🧾 Expenses</h1>
      <p class="text-sm text-gray-500" id="dateDisplay"></p>
      <p class="text-xs text-amber-700 mt-1">Logged in as <span class="font-bold" id="workerLabel">…</span></p>
      <p class="text-xs text-gray-400 mt-2">Log each bill from purchases made for the shop. Check today's entries below to avoid duplicates.</p>
    </header>

    <!-- Add entry form -->
    <div class="bg-white rounded-2xl p-6 shadow-md mb-6">
      <h2 class="text-lg font-bold text-gray-800 mb-4">Add Expense</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Bill No.</label>
          <input id="billInput" type="text" placeholder="e.g. ABC123" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-purple-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Amount (₹)</label>
          <input id="amountInput" type="number" min="1" step="1" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-purple-400 focus:outline-none" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Items (comma-separated)</label>
          <input id="itemsInput" type="text" placeholder="e.g. lemon, banana, chocolate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-purple-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Recorded by</label>
          <select id="workerSelect" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:border-purple-400 focus:outline-none">
            <option value="surya">Surya</option>
            <option value="sushanth">Sushanth</option>
          </select>
        </div>
      </div>

      <button id="addBtn" class="mt-4 w-full bg-purple-500 hover:bg-purple-600 disabled:bg-gray-300 text-white font-bold py-3 rounded-xl shadow-md transition-all">
        + Add Expense
      </button>
      <p id="formMsg" class="text-sm mt-3 hidden"></p>
    </div>

    <!-- Today's entries -->
    <div class="bg-white rounded-2xl p-6 shadow-md mb-6">
      <h2 class="text-lg font-bold text-gray-800 mb-2">Today's Expenses</h2>
      <div id="entriesList" class="overflow-x-auto">Loading…</div>

      <div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between">
        <span class="text-sm text-gray-500"><span id="entryCount">0</span> bills today</span>
        <span class="text-lg font-bold text-purple-700">Total: <span id="totalAmount">₹ 0</span></span>
      </div>
    </div>
  </div>

  <script type="module">
    import { addExpense, getExpensesByDate, deleteExpense } from './app.js';

    // ===== Auth gate =====
    const _auth = JSON.parse(sessionStorage.getItem('tsf_auth') || '{}');
    const AUTH_TTL_MS = 60 * 60 * 1000;
    if (_auth.target !== 'expense' || !_auth.worker || !_auth.at || Date.now() - _auth.at > AUTH_TTL_MS) {
      alert('Please open this page from the home portal (authentication required).');
      location.href = 'index.html';
      throw new Error('not authenticated');
    }
    const authedWorker = _auth.worker;
    document.getElementById('workerLabel').textContent = authedWorker.charAt(0).toUpperCase() + authedWorker.slice(1);
    document.getElementById('workerSelect').value = authedWorker;

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    const today = new Date();
    document.getElementById('dateDisplay').textContent = today.toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    function showMsg(text, ok = true) {
      const el = document.getElementById('formMsg');
      el.textContent = text;
      el.className = `text-sm mt-3 ${ok ? 'text-purple-600' : 'text-red-600'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function fmt(n) { return '₹ ' + n.toLocaleString('en-IN'); }
    function timeOf(ts) { return new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    function escapeHTML(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadEntries() {
      const listEl = document.getElementById('entriesList');
      try {
        const entries = await getExpensesByDate(todayStr());
        if (entries.length === 0) {
          listEl.innerHTML = '<p class="text-gray-400 italic text-sm">No expenses logged yet today.</p>';
        } else {
          let html = `<table class="w-full text-sm">
            <thead>
              <tr class="text-left text-gray-500 border-b">
                <th class="py-2">Time</th>
                <th class="py-2">Bill No.</th>
                <th class="py-2">Items</th>
                <th class="py-2 text-right">Amount</th>
                <th class="py-2">By</th>
                <th class="py-2"></th>
              </tr>
            </thead>
            <tbody>`;
          entries.forEach(e => {
            html += `<tr class="border-b border-gray-50 hover:bg-gray-50 align-top">
              <td class="py-2 text-gray-500 whitespace-nowrap">${timeOf(e.ts)}</td>
              <td class="py-2 font-semibold whitespace-nowrap">${escapeHTML(e.billNo)}</td>
              <td class="py-2 text-gray-700">${(e.items || []).map(escapeHTML).join(', ')}</td>
              <td class="py-2 text-right font-semibold whitespace-nowrap">${fmt(e.amount)}</td>
              <td class="py-2 text-gray-600 whitespace-nowrap">${cap(e.worker)}</td>
              <td class="py-2 text-right">
                <button class="del-btn text-red-500 hover:text-red-700 text-xs" data-id="${e.id}" data-bill="${escapeHTML(e.billNo)}">🗑</button>
              </td>
            </tr>`;
          });
          html += '</tbody></table>';
          listEl.innerHTML = html;
          listEl.querySelectorAll('.del-btn').forEach(btn => {
            btn.addEventListener('click', () => onDelete(btn.dataset.id, btn.dataset.bill));
          });
        }

        const total = entries.reduce((s, e) => s + (e.amount || 0), 0);
        document.getElementById('totalAmount').textContent = fmt(total);
        document.getElementById('entryCount').textContent = entries.length;
      } catch (e) {
        listEl.innerHTML = `<p class="text-red-500 text-sm">Error: ${e.message}</p>`;
      }
    }

    async function onDelete(id, billLabel) {
      if (!confirm(`Delete expense for bill ${billLabel}? This can't be undone.`)) return;
      try {
        await deleteExpense(id);
        showMsg(`Expense deleted.`);
        loadEntries();
      } catch (e) {
        showMsg(`✗ ${e.message}`, false);
      }
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const billNo = document.getElementById('billInput').value.trim();
      const amountStr = document.getElementById('amountInput').value.trim();
      const amount = parseInt(amountStr, 10);
      const itemsRaw = document.getElementById('itemsInput').value.trim();
      const worker = document.getElementById('workerSelect').value;

      if (!billNo) return showMsg('Enter a bill number', false);
      if (!Number.isFinite(amount) || amount <= 0) return showMsg('Enter an amount greater than 0', false);
      const items = itemsRaw.split(',').map(s => s.trim()).filter(Boolean);
      if (items.length === 0) return showMsg('Enter at least one item', false);

      const btn = document.getElementById('addBtn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      try {
        await addExpense({
          billNo,
          items,
          amount,
          worker,
          date: todayStr(),
          ts: new Date().toISOString(),
        });
        showMsg(`✓ Expense added (${fmt(amount)}).`);
        // Reset form fields but keep "recorded by" for fast repeat entry
        document.getElementById('billInput').value = '';
        document.getElementById('amountInput').value = '';
        document.getElementById('itemsInput').value = '';
        document.getElementById('billInput').focus();
        loadEntries();
      } catch (e) {
        showMsg(`✗ ${e.message}`, false);
      } finally {
        btn.disabled = false;
        btn.textContent = '+ Add Expense';
      }
    });

    // Enter in any field submits
    ['billInput', 'amountInput', 'itemsInput'].forEach(id => {
      document.getElementById(id).addEventListener('keypress', e => {
        if (e.key === 'Enter') document.getElementById('addBtn').click();
      });
    });

    loadEntries();
  </script>
</body>
</html>
